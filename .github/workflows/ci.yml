name: CI

on:
  push:
    branches:
      - main
      - feature/unit-testing
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CoffeeNChill.slnx

      - name: Build
        run: dotnet build CoffeeNChill.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test CoffeeNChill.slnx --no-build --configuration Release
